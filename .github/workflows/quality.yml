name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  e2e:
    name: E2E against dedicated test environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check E2E configuration
        id: e2e-config
        env:
          TEST_URL: ${{ secrets.E2E_SUPABASE_URL }}
          TEST_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          RESIDENT_EMAIL: ${{ secrets.E2E_RESIDENT_EMAIL }}
          RESIDENT_PASSWORD: ${{ secrets.E2E_RESIDENT_PASSWORD }}
          MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -n "$TEST_URL" ] && [ -n "$TEST_ANON_KEY" ] && \
             [ -n "$RESIDENT_EMAIL" ] && [ -n "$RESIDENT_PASSWORD" ] && \
             [ -n "$MANAGER_EMAIL" ] && [ -n "$MANAGER_PASSWORD" ] && \
             [ -n "$ADMIN_EMAIL" ] && [ -n "$ADMIN_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "E2E skipped: configure the documented dedicated-test secrets."
          fi

      - name: Setup Node.js
        if: steps.e2e-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.e2e-config.outputs.enabled == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.e2e-config.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        if: steps.e2e-config.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_RESIDENT_EMAIL: ${{ secrets.E2E_RESIDENT_EMAIL }}
          E2E_RESIDENT_PASSWORD: ${{ secrets.E2E_RESIDENT_PASSWORD }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e
